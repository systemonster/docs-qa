services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docs_qa
      POSTGRES_PASSWORD: docs_qa
      POSTGRES_DB: docs_qa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs_qa -d docs_qa"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      args:
        EXTRAS: "[anthropic]"
    environment:
      DATABASE_URL: postgresql://docs_qa:docs_qa@db:5432/docs_qa
      # LLM_PROVIDER: anthropic
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
