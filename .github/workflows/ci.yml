name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docs_qa
          POSTGRES_PASSWORD: docs_qa
          POSTGRES_DB: docs_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docs_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests use the offline hash embedder, so CI never downloads a model.
      TEST_DATABASE_URL: postgresql://docs_qa:docs_qa@localhost:5432/docs_qa_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=docs_qa --cov-report=term-missing
